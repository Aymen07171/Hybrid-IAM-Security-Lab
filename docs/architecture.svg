<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1040" viewBox="0 0 1680 1040" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid IAM Security Lab — evidence-based Entra Conditional Access view</title>
  <desc id="desc">A sanitized diagram of the Microsoft Entra settings shown in the Obsidian notes: Security Defaults are disabled, one emergency account has a permanent Global Administrator assignment, the emergency exclusion group exists, an MFA policy is in Report-only, and the legacy authentication policy is only a draft. On-premises hybrid integration and sign-in outcomes are not evidenced.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 z" fill="#334155"/></marker>
    <marker id="dash-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 30px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.sub{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#475569}.section{font:700 11px 'Segoe UI',Arial,sans-serif;letter-spacing:1.2px;fill:#475569}.pill{font:700 12px 'Segoe UI',Arial,sans-serif;letter-spacing:.5px;fill:#7c2d12}.h{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.body{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#334155}.small{font:400 12px 'Segoe UI',Arial,sans-serif;fill:#475569}.flowlabel{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#334155}.foot{font:400 12px 'Segoe UI',Arial,sans-serif;fill:#64748b}
      .frame{fill:#fff;stroke:#94a3b8;stroke-width:1.5;rx:18}.neutral{fill:#fff;stroke:#cbd5e1;stroke-width:1.4;rx:12}.blue{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5;rx:12}.amber{fill:#fffbeb;stroke:#fcd34d;stroke-width:1.5;rx:12}.red{fill:#fff7f7;stroke:#fca5a5;stroke-width:1.5;rx:12}.green{fill:#f0fdf4;stroke:#86efac;stroke-width:1.5;rx:12}.dashed{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:7 6;rx:12}.solid{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:6 6;marker-end:url(#dash-arrow)}.rule{stroke:#cbd5e1;stroke-width:1.2}
    </style>
  </defs>
  <rect class="bg" width="1680" height="1040"/>
  <text class="title" x="72" y="58">Hybrid IAM Security Lab</text>
  <text class="sub" x="72" y="87">Evidence-based current view · Microsoft Entra Conditional Access · captured state, not a target-state claim</text>
  <rect x="1154" y="38" width="454" height="38" rx="19" fill="#fff7ed" stroke="#fdba74"/>
  <text class="pill" x="1381" y="62" text-anchor="middle">REPORT-ONLY / DRAFT STATES ARE NOT ENFORCEMENT</text>

  <rect class="frame" x="72" y="132" width="1536" height="650"/>
  <text class="section" x="100" y="170">MICROSOFT ENTRA ID — CONFIGURATION SHOWN IN THE VAULT SCREENSHOTS</text>
  <line class="rule" x1="100" y1="184" x2="1580" y2="184"/>

  <rect class="neutral" x="112" y="220" width="272" height="144"/>
  <text class="h" x="136" y="254">Emergency access</text>
  <text class="body" x="136" y="284">
    <tspan x="136" dy="0">Two accounts intended in the note</tspan>
    <tspan x="136" dy="20">One permanent Global Admin</tspan>
    <tspan x="136" dy="18">assignment captured</tspan>
  </text>
  <text class="small" x="136" y="346">Methods and sign-in tests not shown</text>

  <rect class="amber" x="426" y="220" width="280" height="144"/>
  <text class="h" x="450" y="254">Security Defaults</text>
  <text class="body" x="450" y="291">
    <tspan x="450" dy="0">Disabled in the capture</tspan>
    <tspan x="450" dy="21">No enforced replacement baseline</tspan>
    <tspan x="450" dy="18">is evidenced here</tspan>
  </text>

  <rect class="blue" x="748" y="220" width="342" height="144"/>
  <text class="h" x="772" y="254">CA-Exclude-EmergencyAccess</text>
  <text class="body" x="772" y="284">
    <tspan x="772" dy="0">Security group · Assigned membership</tspan>
    <tspan x="772" dy="20">Two members selected at creation</tspan>
    <tspan x="772" dy="18">Final roster needs verification</tspan>
  </text>

  <rect class="green" x="1132" y="220" width="424" height="144"/>
  <text class="h" x="1156" y="254">User / administrator sign-in</text>
  <text class="body" x="1156" y="284">
    <tspan x="1156" dy="0">Conditional Access evaluates the saved policy</tspan>
    <tspan x="1156" dy="20">Sign-in outcome evidence was not supplied</tspan>
  </text>

  <rect class="blue" x="216" y="430" width="572" height="218"/>
  <text class="h" x="244" y="468">CA-01 — Require MFA for Admins</text>
  <rect x="244" y="484" width="122" height="26" rx="13" fill="#dbeafe"/>
  <text class="flowlabel" x="305" y="502" text-anchor="middle">CREATED</text>
  <rect x="376" y="484" width="154" height="26" rx="13" fill="#fef3c7"/>
  <text class="flowlabel" x="453" y="502" text-anchor="middle">REPORT-ONLY</text>
  <text class="body" x="244" y="540">
    <tspan x="244" dy="0">All resources and Require MFA are shown in setup.</tspan>
    <tspan x="244" dy="21">Captured assignment says all users included; written</tspan>
    <tspan x="244" dy="19">steps say admin roles. Resolve scope/name mismatch.</tspan>
  </text>
  <text class="small" x="244" y="624">Report-only evaluates/logs; it does not prompt or enforce.</text>

  <rect class="red" x="892" y="430" width="572" height="218"/>
  <text class="h" x="920" y="468">CA-02 — Block Legacy Authentication</text>
  <rect x="920" y="484" width="126" height="26" rx="13" fill="#fee2e2"/>
  <text class="flowlabel" x="983" y="502" text-anchor="middle">DRAFT ONLY</text>
  <text class="body" x="920" y="540">
    <tspan x="920" dy="0">Exchange ActiveSync and Other clients selected.</tspan>
    <tspan x="920" dy="21">Grant shows zero controls; Create is still available.</tspan>
    <tspan x="920" dy="19">No Block access grant or saved policy is evidenced.</tspan>
  </text>
  <text class="small" x="920" y="624">No blocking effect can be claimed from this capture.</text>

  <path class="dash" d="M248 364 L248 390 L919 390 L919 364"/>
  <text class="flowlabel" x="584" y="384" text-anchor="middle">emergency accounts intended as group members</text>
  <path class="dash" d="M919 364 L919 406 L650 406 L650 422"/>
  <text class="flowlabel" x="787" y="401" text-anchor="middle">intended CA exclusion</text>

  <rect class="dashed" x="112" y="694" width="665" height="54"/>
  <text class="h" x="136" y="728">Hybrid directory link: not evidenced</text>
  <text class="small" x="463" y="727">No AD DS, Entra Connect/Cloud Sync, or federation shown.</text>
  <rect class="dashed" x="812" y="694" width="744" height="54"/>
  <text class="h" x="836" y="728">Runtime validation: not supplied</text>
  <text class="small" x="1155" y="727">Add sign-in logs and controlled positive/negative tests.</text>

  <rect x="72" y="824" width="1536" height="142" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <text class="section" x="100" y="858">SAFE NEXT STEP</text>
  <text class="body" x="100" y="891">
    <tspan x="100" dy="0">Verify the complete policy list and licensing. Keep Security Defaults enabled unless equivalent Conditional Access protections are ready.</tspan>
    <tspan x="100" dy="23">Resolve CA-01 scope, finish CA-02 with Block access, review report-only sign-in results, then stage enforcement and test emergency recovery.</tspan>
  </text>
  <text class="foot" x="100" y="944">Original screenshots stay in the private vault because they include tenant and account identifiers. Diagram values are sanitized summaries of those captures.</text>
</svg>

