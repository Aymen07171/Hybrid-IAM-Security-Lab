<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid IAM Security Lab — proposed logical reference architecture</title>
  <desc id="desc">A technology-neutral reference diagram showing users and lifecycle events, identity governance, a local identity domain, a sync or federation trust boundary, cloud identity and policy, local and cloud resources, and centralized audit monitoring. This is illustrative and is not evidence of the deployed lab.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 z" fill="#334155"/>
    </marker>
    <marker id="arrow-light" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 z" fill="#64748b"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .label { font: 700 11px 'Segoe UI', Arial, sans-serif; letter-spacing: 1.2px; fill: #475569; }
      .pill { font: 700 12px 'Segoe UI', Arial, sans-serif; letter-spacing: .65px; fill: #7c2d12; }
      .node-title { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .node-text { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .small { font: 400 12px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .flow-label { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .foot { font: 400 12px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
      .card-blue { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; rx: 14; }
      .card-purple { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 1.5; rx: 14; }
      .card-amber { fill: #fffbeb; stroke: #fcd34d; stroke-width: 1.5; rx: 14; }
      .card-green { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.5; rx: 14; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .audit-flow { fill: none; stroke: #64748b; stroke-width: 1.7; stroke-dasharray: 6 6; marker-end: url(#arrow-light); }
      .thin { fill: none; stroke: #cbd5e1; stroke-width: 1.2; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1680" height="1080"/>

  <text class="title" x="72" y="62">Hybrid IAM Security Lab</text>
  <text class="subtitle" x="72" y="91">Logical reference architecture · technology-neutral · proposed, not verified against the lab</text>
  <rect x="1192" y="42" width="416" height="38" rx="19" fill="#fff7ed" stroke="#fdba74"/>
  <text class="pill" x="1400" y="66" text-anchor="middle">ILLUSTRATIVE TARGET DESIGN — NOT DEPLOYMENT EVIDENCE</text>

  <text class="label" x="72" y="145">IDENTITY LIFECYCLE AND ACCESS PATH</text>
  <line class="thin" x1="72" y1="157" x2="1608" y2="157"/>

  <!-- Interactive authentication path routed above the component row. -->
  <path class="flow" d="M190 218 L190 184 L1466 184 L1466 218"/>
  <rect x="700" y="169" width="250" height="28" rx="14" fill="#f8fafc"/>
  <text class="flow-label" x="825" y="188" text-anchor="middle">Interactive sign-in request</text>

  <!-- Identity lifecycle and trust chain. -->
  <rect class="card" x="72" y="218" width="236" height="168"/>
  <circle cx="104" cy="253" r="14" fill="#dbeafe"/>
  <path d="M98 253h12M104 247v12" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/>
  <text class="node-title" x="128" y="258">People &amp; events</text>
  <text class="node-text" x="96" y="294">
    <tspan x="96" dy="0">Users and administrators</tspan>
    <tspan x="96" dy="21">Approved joiner / mover /</tspan>
    <tspan x="96" dy="18">leaver changes</tspan>
  </text>
  <text class="small" x="96" y="365">Identity source: to be confirmed</text>

  <rect class="card-blue" x="354" y="218" width="284" height="168"/>
  <text class="node-title" x="378" y="253">Provisioning &amp; governance</text>
  <text class="node-text" x="378" y="286">
    <tspan x="378" dy="0">Map approved job function to</tspan>
    <tspan x="378" dy="19">scoped role/group assignments</tspan>
    <tspan x="378" dy="24">Record approvals and exceptions</tspan>
  </text>
  <text class="small" x="378" y="365">Recommended process boundary</text>

  <rect class="card" x="684" y="218" width="264" height="168"/>
  <text class="node-title" x="708" y="253">Local identity domain</text>
  <text class="node-text" x="708" y="286">
    <tspan x="708" dy="0">Directory and local identity</tspan>
    <tspan x="708" dy="19">authority, if in scope</tspan>
    <tspan x="708" dy="24">Define attribute ownership</tspan>
  </text>
  <text class="small" x="708" y="365">Product and configuration unknown</text>

  <rect class="card-amber" x="994" y="218" width="236" height="168"/>
  <text class="node-title" x="1018" y="253">Identity bridge</text>
  <text class="node-text" x="1018" y="286">
    <tspan x="1018" dy="0">Scoped synchronization</tspan>
    <tspan x="1018" dy="19">and/or federation</tspan>
    <tspan x="1018" dy="24">Credentials, scope, and</tspan>
    <tspan x="1018" dy="18">failure behavior documented</tspan>
  </text>
  <text class="small" x="1018" y="365">Trust boundary · mechanism unknown</text>

  <rect class="card-purple" x="1276" y="218" width="332" height="168"/>
  <text class="node-title" x="1300" y="253">Cloud identity &amp; policy</text>
  <text class="node-text" x="1300" y="286">
    <tspan x="1300" dy="0">Authenticate subject and evaluate</tspan>
    <tspan x="1300" dy="19">applicable factor and context policy</tspan>
    <tspan x="1300" dy="24">Identity provider / MFA / rules</tspan>
    <tspan x="1300" dy="18">are not yet verified</tspan>
  </text>

  <!-- Provisioning/trust arrows. -->
  <path class="flow" d="M308 302 L346 302"/>
  <text class="flow-label" x="327" y="289" text-anchor="middle">change</text>
  <path class="flow" d="M638 302 L676 302"/>
  <text class="flow-label" x="657" y="289" text-anchor="middle">assign</text>
  <path class="flow" d="M948 302 L986 302"/>
  <text class="flow-label" x="967" y="289" text-anchor="middle">sync / trust</text>
  <path class="flow" d="M1230 302 L1268 302"/>
  <text class="flow-label" x="1249" y="289" text-anchor="middle">identity data</text>

  <text class="label" x="72" y="447">RESOURCE AUTHORIZATION</text>
  <line class="thin" x1="72" y1="459" x2="1608" y2="459"/>

  <rect class="card-green" x="560" y="492" width="354" height="126"/>
  <text class="node-title" x="584" y="530">Local resources</text>
  <text class="node-text" x="584" y="560">
    <tspan x="584" dy="0">Applications / systems, if included</tspan>
    <tspan x="584" dy="20">Enforce local role and permission checks</tspan>
  </text>
  <path class="flow" d="M816 386 L816 484"/>
  <text class="flow-label" x="831" y="440">local authz</text>

  <rect class="card-green" x="1108" y="492" width="354" height="126"/>
  <text class="node-title" x="1132" y="530">Cloud applications / resources</text>
  <text class="node-text" x="1132" y="560">
    <tspan x="1132" dy="0">Grant only the allowed session</tspan>
    <tspan x="1132" dy="20">Enforce resource-level authorization</tspan>
  </text>
  <path class="flow" d="M1442 386 L1442 484"/>
  <text class="flow-label" x="1458" y="440">policy decision</text>

  <text class="label" x="72" y="690">AUDIT AND OPERATIONS</text>
  <line class="thin" x1="72" y1="702" x2="1608" y2="702"/>

  <rect class="card-blue" x="350" y="748" width="980" height="132"/>
  <text class="node-title" x="378" y="788">Central audit and monitoring</text>
  <text class="node-text" x="378" y="819">
    <tspan x="378" dy="0">Collect identity changes, provisioning, bridge errors, sign-in and policy decisions, privileged actions, and resource activity.</tspan>
    <tspan x="378" dy="21">Define access to logs, retention, review ownership, alerting, and incident follow-up.</tspan>
  </text>
  <text class="small" x="378" y="864">Central log destination and retention are not confirmed for this project.</text>

  <!-- Evidence streams are dashed; they are recommended, not confirmed. -->
  <path class="audit-flow" d="M496 386 L496 650 L500 650 L500 740"/>
  <path class="audit-flow" d="M816 618 L816 740"/>
  <path class="audit-flow" d="M1112 386 L1112 650 L1050 650 L1050 740"/>
  <path class="audit-flow" d="M1285 386 L1285 650 L1160 650 L1160 740"/>
  <path class="audit-flow" d="M1280 618 L1280 740"/>

  <rect x="72" y="926" width="1536" height="88" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <line x1="102" y1="958" x2="158" y2="958" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text class="small" x="172" y="962">Identity / access flow</text>
  <line x1="366" y1="958" x2="422" y2="958" stroke="#64748b" stroke-width="1.7" stroke-dasharray="6 6" marker-end="url(#arrow-light)"/>
  <text class="small" x="436" y="962">Recommended audit evidence flow</text>
  <rect x="770" y="944" width="18" height="18" rx="4" fill="#ffffff" stroke="#94a3b8"/>
  <text class="small" x="800" y="959">Generic component; replace with verified lab state</text>
  <text class="foot" x="102" y="991">Use this as a discussion model only. Confirm products, protocols, trust direction, policy enforcement, and log sources before describing the diagram as-built.</text>
</svg>

